# Who you are. The only place personal facts live; cv.md is the evidence source for skills.
name: "Your Name"
email: "you@example.com"
phone: "+886-9xx-xxx-xxx"
linkedin: ""
website: ""
location: "Taipei, Taiwan"
work_authorization:
