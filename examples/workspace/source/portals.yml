# Sources for S1 Discover. Login-free APIs only. Login-required sites are handled in P3+.
sources:
  greenhouse:
    enabled: true
    # Greenhouse board tokens (https://boards.greenhouse.io/<token>). Public API, no auth.
    boards:
      - cloudflare
      - gitlab
    # A job is kept when its title matches ANY keyword (case-insensitive substring).
    keywords:
      - backend
      - platform
      - software engineer
      - site reliability
    # Keep when location.name or "Job Posting Location" metadata matches ANY of these. Empty list = keep all.
    locations:
      - taiwan
      - taipei
      - remote
      - apac
      - asia
  ashby:
    enabled: false
    # Ashby board names (https://jobs.ashbyhq.com/<board>). Public API, no auth. The job text comes with the list.
    boards:
      - example-board
    keywords:
      - engineering manager
      - director
    # Match explicit words; a bare "remote" also catches hybrid roles in other countries.
    locations:
      - taiwan
      - apac
      - worldwide
      - global
    title_include:
      - 'engineer|software|platform|infrastructure|\bAI\b|data|security|cloud'
    title_exclude:
      - 'recruit|sales|marketing|finance|legal|people|talent|account|support'
  yourator:
    enabled: false
    # Taiwan start-up board. One search per keyword; the city filter compares with the list text (it spells 臺, so list both forms).
    keywords:
      - engineering manager
      - 研發經理
    locations:
      - 臺北
      - 台北
      - 新北
    max_pages: 3
    require_listed: tw
    title_include:
      - 'engineer|software|軟體|研發|資訊'
    title_exclude:
      - 'sales|業務|行銷|設計'
  cake:
    enabled: false
    # Cake search API through your own Chrome (attach: cdp). One search per keyword.
    keywords:
      - engineering manager
    locations:
      - Taiwan
    max_pages: 3
    require_listed: tw
    # Employers that are not listed but acceptable (foreign companies with a Taiwan office), matched by contained name.
    allow_companies:
      - Example Global
    title_include:
      - 'engineer|software|軟體'
    title_exclude:
      - 'sales|業務|行銷'
  "104":
    enabled: true
    # One search per keyword × area.
    keywords:
      - Node.js 後端
      - Golang
      - Platform Engineer
    # 104 area codes: 6001001000 台北市, 6001002000 新北市, 6001006000 新竹縣市, 6001008000 台中市, 6001016000 高雄市
    areas:
      - 6001001000
      - 6001002000
    max_pages: 2
    pagesize: 20
    # Optional: also read the job lists of the largest listed employers directly (market-cap ranking from the exchange open data).
    # companies:
    #   top: 50
    #   keywords: [經理, 主管, Manager, Director]
    #   max_pages: 2
    #   locations: [台北市, 新北市]
    # Optional: keep only Taiwan-listed (TWSE / TPEx) employers; checked against the exchanges' open data.
    # require_listed: tw
    # Optional title screen (regexes, case-insensitive). Every title_include entry must match; any title_exclude match drops.
    # After editing: node scripts/discover.mjs --rescreen drops open rows that no longer pass.
    # title_include: ['manager|lead|head|director']
    # title_exclude: ['intern|junior']
    # Passed straight into the search API. ro=1 full-time, order=15 newest first, remoteWork=1 remote only.
    params:
      ro: 1
      order: 15
  linkedin:
    enabled: false
    # Guest search API, no login. Rate-limited hard (HTTP 429): keep keywords few and max_pages 1. Falls back to your
    # Chrome when a JS wall appears. Enable only after prepare.mjs linkedin --check works, and keep daily_max.linkedin low.
    keywords:
      - Engineering Manager
      - Director of Engineering
    locations:
      - Taiwan
    max_pages: 1
    # extra query params, e.g. f_WT: 2 (remote), f_TPR: r604800 (past week)
    params:
      f_TPR: r604800
  tsmc:
    enabled: false
    # Needs your own Chrome with a debugging port (browser.yml: attach: cdp); the site rejects plain HTTP clients.
    # Query keys: org, location, category, job_type, employment, keyword. See adapters/tsmc.mjs for the accepted names.
    max_pages: 15
    queries:
      - { location: Taiwan, job_type: "Manager / Executive" }
      - { location: Taiwan, keyword: "program manager" }
