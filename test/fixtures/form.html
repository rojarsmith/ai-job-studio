<!doctype html>
<html><head><meta charset="utf-8"><title>Fixture application form</title></head>
<body>
<form id="application_form">
  <label for="first_name">First Name *</label><input id="first_name" name="first_name" required>
  <label for="last_name">Last Name *</label><input id="last_name" name="last_name" required>
  <label for="email">Email *</label><input id="email" name="email" type="email" required>
  <label for="phone">Phone</label><input id="phone" name="phone" type="tel">
  <label for="resume">Resume/CV *</label><input id="resume" name="resume" type="file" accept=".pdf" required>
  <label for="cover">Cover Letter</label><input id="cover" name="cover_letter" type="file" accept=".pdf">
  <label for="linkedin">LinkedIn Profile</label><input id="linkedin" name="linkedin">
  <div class="field"><label for="auth">Are you legally authorized to work in the United States?</label>
    <select id="auth" name="auth"><option value="">Select...</option><option value="yes">Yes</option><option value="no">No</option></select></div>
  <div class="field"><label for="why">Why do you want to work here?</label><textarea id="why" name="why"></textarea></div>
  <div class="field"><label for="salary">Desired salary</label><input id="salary" name="salary"></div>
  <fieldset><legend>Gender</legend><label><input type="radio" name="gender" value="m"> Male</label><label><input type="radio" name="gender" value="f"> Female</label></fieldset>
  <label><input type="checkbox" name="agree"> I agree to the privacy policy</label>
  <input type="hidden" name="token" value="abc">
  <button type="submit" id="submit_app">Submit application</button>
</form>
</body></html>
